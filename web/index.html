<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monokrom</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 640px;
            height: 576px;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1" width="640" height="576"></canvas>
    <script src="gl.js"></script>
    <script src="sapp_jsutils.js"></script>
    <script src="quad-storage.js"></script>
    <script src="monokrom.js"></script>
    <script>load("monokrom.wasm");</script>
    <script>
    // Scale canvas to fit viewport without changing buffer size
    (function() {
        var canvas = document.getElementById('glcanvas');
        function fit() {
            var sx = window.innerWidth / 640;
            var sy = window.innerHeight / 576;
            var s = Math.min(sx, sy, 1);
            canvas.style.transform = s < 1 ? 'scale(' + s + ')' : '';
        }
        window.addEventListener('resize', fit);
        fit();
    })();

    // Mobile support (virtual keyboard + arrow keys)
    (function() {
        if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;

        function sendKey(codeName, modifiers) {
            if (!wasm_exports) return;
            var code = into_sapp_keycode(codeName);
            wasm_exports.key_down(code, modifiers || 0, false);
            wasm_exports.key_up(code, modifiers || 0);
        }

        function sendChar(ch) {
            if (!wasm_exports) return;
            var code = into_sapp_keycode(codeForChar(ch));
            var mods = getModifiers();
            wasm_exports.key_down(code, mods, false);
            if (!mods) wasm_exports.key_press(ch.charCodeAt(0));
            wasm_exports.key_up(code, mods);
            releaseModifiers();
        }

        function codeForChar(ch) {
            var upper = ch.toUpperCase();
            if (upper >= 'A' && upper <= 'Z') return 'Key' + upper;
            if (ch >= '0' && ch <= '9') return 'Digit' + ch;
            var map = {
                ' ': 'Space', '.': 'Period', ',': 'Comma', '-': 'Minus',
                '=': 'Equal', '/': 'Slash', ';': 'Semicolon', "'": 'Quote',
                '[': 'BracketLeft', ']': 'BracketRight', '\\': 'Backslash',
                '`': 'Backquote'
            };
            return map[ch] || 'Unidentified';
        }

        // Modifier state
        var modState = { alt: false, shift: false };
        var SAPP_SHIFT = 1, SAPP_ALT = 4;

        function getModifiers() {
            return (modState.alt ? SAPP_ALT : 0) | (modState.shift ? SAPP_SHIFT : 0);
        }

        // Toggle a modifier: send key_down when activating, key_up when deactivating.
        // This ensures modifier state is set in a separate frame from the action key.
        function toggleModifier(key) {
            if (!wasm_exports) return;
            modState[key] = !modState[key];
            if (key === 'alt') {
                if (modState.alt) wasm_exports.key_down(into_sapp_keycode('AltLeft'), SAPP_ALT, false);
                else wasm_exports.key_up(into_sapp_keycode('AltLeft'), 0);
            } else {
                if (modState.shift) wasm_exports.key_down(into_sapp_keycode('ShiftLeft'), SAPP_SHIFT, false);
                else wasm_exports.key_up(into_sapp_keycode('ShiftLeft'), 0);
            }
            updateToggleStyles();
        }

        function releaseModifiers() {
            if (!wasm_exports) return;
            if (modState.alt) wasm_exports.key_up(into_sapp_keycode('AltLeft'), 0);
            if (modState.shift) wasm_exports.key_up(into_sapp_keycode('ShiftLeft'), 0);
            modState.alt = false;
            modState.shift = false;
            updateToggleStyles();
        }

        function sendKeyMod(codeName) {
            if (!wasm_exports) return;
            var code = into_sapp_keycode(codeName);
            var mods = getModifiers();
            wasm_exports.key_down(code, mods, false);
            wasm_exports.key_up(code, mods);
            releaseModifiers();
        }

        function updateToggleStyles() {
            if (altBtn) altBtn.style.background = modState.alt ? '#888' : '#333';
            if (shiftBtn) shiftBtn.style.background = modState.shift ? '#888' : '#333';
        }

        // Virtual button bar
        var bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:36px;display:flex;align-items:center;justify-content:center;gap:3px;background:rgba(0,0,0,0.8);z-index:20;touch-action:none;';

        var btnStyle = 'height:28px;border:1px solid #888;border-radius:4px;background:#333;color:#fff;font-size:12px;line-height:1;touch-action:none;-webkit-user-select:none;user-select:none;padding:0 6px;min-width:32px;';

        var altBtn = null, shiftBtn = null;

        var buttons = [
            ['Esc', 'Escape', false],
            ['Alt', null, true],
            ['Shift', null, true],
            ['Tab', 'Tab', false],
            ['\u25C0', 'ArrowLeft', false],
            ['\u25B2', 'ArrowUp', false],
            ['\u25BC', 'ArrowDown', false],
            ['\u25B6', 'ArrowRight', false],
            ['PgU', 'PageUp', false],
            ['PgD', 'PageDown', false]
        ];

        buttons.forEach(function(b) {
            var btn = document.createElement('button');
            btn.textContent = b[0];
            btn.style.cssText = btnStyle;
            if (b[2]) {
                // Toggle button (Alt/Shift)
                if (b[0] === 'Alt') altBtn = btn;
                if (b[0] === 'Shift') shiftBtn = btn;
                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    toggleModifier(b[0].toLowerCase());
                });
            } else {
                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    sendKeyMod(b[1]);
                });
            }
            bar.appendChild(btn);
        });
        document.body.appendChild(bar);

        // Hidden textarea for keyboard input
        var ta = document.createElement('textarea');
        ta.id = 'mobile-input';
        ta.autocapitalize = 'off';
        ta.autocomplete = 'off';
        ta.autocorrect = 'off';
        ta.spellcheck = false;
        ta.style.cssText = 'position:fixed;top:36px;left:0;width:100%;height:calc(100% - 36px);opacity:0;z-index:10;font-size:16px;resize:none;border:none;outline:none;padding:0;color:transparent;background:transparent;caret-color:transparent;';
        document.body.appendChild(ta);

        ta.value = ' ';
        ta.selectionStart = 1;
        ta.selectionEnd = 1;

        function resetInput() {
            ta.value = ' ';
            ta.selectionStart = 1;
            ta.selectionEnd = 1;
        }

        ta.addEventListener('beforeinput', function(e) {
            if (e.inputType === 'deleteContentBackward') {
                sendKey('Backspace');
                e.preventDefault();
                resetInput();
            } else if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') {
                sendKey('Enter');
                wasm_exports && wasm_exports.key_press(13);
                e.preventDefault();
                resetInput();
            } else if (e.inputType === 'insertText' && e.data) {
                for (var i = 0; i < e.data.length; i++) {
                    sendChar(e.data[i]);
                }
                e.preventDefault();
                resetInput();
            }
        });

        ta.addEventListener('input', function() {
            if (ta.value !== ' ') resetInput();
        });
    })();
    </script>
</body>
</html>
